# Render "Blueprint" dosyası (Hafta 7 - Canlı yayın)
# Render bu dosyayı okuyup web servisini kurar. Anlatım: docs/CANLI_YAYIN.md
#
# v0.10.8: Veri tabanı artık Render'da DEĞİL, Neon'da (neon.tech, ücretsiz, süresi dolmaz).
# Render'ın ücretsiz PostgreSQL'i 30 gün sonra siliniyordu (1 Aralık 2026). Veriler Neon'a
# taşındı; adres Render panelinde DATABASE_URL olarak girilir (aşağıda sync: false).

services:
  - type: web
    name: tarladan-sofraya
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Her açılışta: 1) tabloları migration ile güncelle  2) roller/kategoriler
    #               3) demo verisi (yalnızca ilk sefer)    4) demo ilanlarını Pazar'dan kaldır
    #               5) hal fiyatları (eksik günler, Hafta 9) 6) web sunucusunu başlat
    startCommand: flask db upgrade && flask seed-db && flask seed-demo && flask remove-demo-listings && flask fetch-prices --days 60 && gunicorn run:app --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FLASK_APP
        value: run.py
      - key: FLASK_ENV
        value: production      # config.py -> ProductionConfig (DEBUG kapalı, güvenli çerez)
      - key: SECRET_KEY
        generateValue: true    # Render uzun rastgele bir anahtar üretir; kimse görmez
      - key: DATABASE_URL
        sync: false            # Neon bağlantı adresi (postgresql://...neon.tech/...); panelde girilir, koda yazılmaz
      - key: DEMO_PASSWORD
        sync: false            # Render kurulumda bu değeri SİZE sorar (koda yazılmaz)
      # --- Hafta 9-10 ---
      - key: USE_MOCK_APIS
        value: "1"             # gerçek fiyat/ödeme API'si bağlanınca "0" yapılır
      - key: GEMINI_API_KEY
        sync: false            # ÜCRETSİZ yapay zekâ anahtarı (aistudio.google.com); boş bırakılabilir
      - key: ANTHROPIC_API_KEY
        sync: false            # Yapay zekâ anahtarı: Render kurulumda SORAR, koda yazılmaz (boş bırakılabilir)
